    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/thermal_cycle/
  - name: 'disk-loaded-bashboards2'
    orgId: 1
    folder: 'stable_version/IVcurves'
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/IVcurve/
